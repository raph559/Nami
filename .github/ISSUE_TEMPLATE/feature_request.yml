name: Feature request
description: Suggest an idea for Nami
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you would like
      description: What you want to do, and why it would help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots or examples from other apps.
