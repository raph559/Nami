name: Engine

on:
  push:
    paths: [engine/**, .github/workflows/engine.yml]
  pull_request:
    paths: [engine/**, .github/workflows/engine.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - run: go vet -tags nosqlite ./...
      # Streams the start of Sintel (CC-BY) through the engine's HTTP API.
      - run: go test -tags nosqlite -timeout 5m ./...
