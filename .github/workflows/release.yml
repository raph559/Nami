name: Release

# Builds the unsigned iOS app. Android and Windows are built locally with
# engine/build-shared.sh, so their signing key never leaves the maintainer's machine.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Build the engine (static archive, linked into Runner)
        working-directory: engine
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG="$(xcrun --sdk iphoneos -f clang) -target arm64-apple-ios15.0 -isysroot $SDK"
          mkdir -p ../mobile/ios/engine
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 CC="$CLANG" \
          CGO_CFLAGS="-O2" CGO_LDFLAGS="-target arm64-apple-ios15.0 -isysroot $SDK" \
            go build -tags "nosqlite disable_libutp" -trimpath -ldflags="-s -w" \
            -buildmode=c-archive -o ../mobile/ios/engine/libnami.a .

      - name: Build the app
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      # Dart finds the engine with DynamicLibrary.process(), so NamiStart must stay exported.
      - name: Check the engine symbol survived linking
        run: |
          bin=mobile/build/ios/iphoneos/Runner.app/Runner
          ls -la "$bin"
          nm -gU "$bin" | grep -i nami || { echo "NamiStart missing"; nm -gU "$bin" | head -20; exit 1; }

      - name: Package the IPA
        run: |
          version=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir Payload
          cp -R mobile/build/ios/iphoneos/Runner.app Payload/
          zip -qry "Nami-$version.ipa" Payload
          echo "IPA=Nami-$version.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ env.IPA }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$IPA" --clobber
    permissions:
      contents: write
