name: nami
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  device_preview: ^3.0.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    # SIL Open Font License, see assets/fonts/OFL-HankenGrotesk.txt.
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-700.ttf
          weight: 700
